name: Build, Patch and Release GPhotos-Mod

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      direct_apk_url:
        description: 'Direct APK Download URL (APKMirror only; HTTPS required)'
        required: false
        type: string
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

permissions:
  contents: write
  packages: read

concurrency:
  group: gphotos-mod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-patch:
    name: Build Patch & Release GPhotos-Mod
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Release Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check beautifulsoup4 curl_cffi

      - name: Validate manual APK URL
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.direct_apk_url != '' }}
        shell: bash
        env:
          DIRECT_APK_URL: ${{ inputs.direct_apk_url }}
        run: |
          set -euo pipefail
          case "$DIRECT_APK_URL" in
            https://*.apkmirror.com/*|https://apkmirror.com/*)
              ;;
            *)
              echo "::error::Only https APKMirror URLs are allowed for manual input."
              exit 1
              ;;
          esac

      - name: Check Latest APKMirror Version
        id: check_upstream
        shell: bash
        run: |
          python .github/scripts/download_apk.py --check-version

      - name: Check Existing Release
        id: check_release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_VER="${{ steps.check_upstream.outputs.apk_version }}"
          APK_VER=$(printf '%s' "$RAW_VER" | sed -E 's/[^0-9.]//g; s/\.+$//')
          echo "Latest upstream version found: ${APK_VER:-unknown}"
          if [ -n "$APK_VER" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            TAG="v${APK_VER}"
            HTTP_STATUS=$(curl -fsSL --proto '=https' -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Release $TAG already exists in ${{ github.repository }}. Skipping duplicate build."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Checkout Patches Repository (Morphe Google Photos)
        if: ${{ steps.check_release.outputs.skip != 'true' }}
        uses: actions/checkout@v7
        with:
          repository: 'Akash-Sriram/morphe-google-photos'
          path: 'morphe-google-photos'
          persist-credentials: false

      - name: Generate launcher icons from source
        if: ${{ steps.check_release.outputs.skip != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          ICON_SRC=".github/icons/icon.png"
          if [ ! -f "$ICON_SRC" ]; then
            echo "No icon source found at $ICON_SRC — skipping icon generation."
            echo "To enable icon generation, add your source PNG to $ICON_SRC and re-run."
            exit 0
          fi

          echo "Installing ImageMagick..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

          RESDIR="morphe-google-photos/app/src/main/res"
          echo "Creating resource directories under $RESDIR"
          mkdir -p "$RESDIR/mipmap-mdpi" "$RESDIR/mipmap-hdpi" "$RESDIR/mipmap-xhdpi" "$RESDIR/mipmap-xxhdpi" "$RESDIR/mipmap-xxxhdpi" "$RESDIR/mipmap-anydpi-v26" "$RESDIR/values"

          echo "Generating legacy mipmap icons..."
          convert "$ICON_SRC" -background none -gravity center -resize 48x48^ -extent 48x48 "$RESDIR/mipmap-mdpi/ic_launcher.png"
          convert "$ICON_SRC" -background none -gravity center -resize 72x72^ -extent 72x72 "$RESDIR/mipmap-hdpi/ic_launcher.png"
          convert "$ICON_SRC" -background none -gravity center -resize 96x96^ -extent 96x96 "$RESDIR/mipmap-xhdpi/ic_launcher.png"
          convert "$ICON_SRC" -background none -gravity center -resize 144x144^ -extent 144x144 "$RESDIR/mipmap-xxhdpi/ic_launcher.png"
          convert "$ICON_SRC" -background none -gravity center -resize 192x192^ -extent 192x192 "$RESDIR/mipmap-xxxhdpi/ic_launcher.png"

          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp "$RESDIR/$d/ic_launcher.png" "$RESDIR/$d/ic_launcher_round.png"
          done

          echo "Generating adaptive foreground..."
          convert "$ICON_SRC" -background none -gravity center -resize 432x432^ -extent 432x432 "$RESDIR/mipmap-anydpi-v26/ic_launcher_foreground.png"
          convert "$ICON_SRC" -background none -gravity center -resize 108x108^ -extent 108x108 "$RESDIR/mipmap-anydpi-v26/ic_launcher_foreground_small.png"

          cat > "$RESDIR/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML

          cat > "$RESDIR/mipmap-anydpi-v26/ic_launcher_round.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML

          cat > "$RESDIR/values/colors.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="ic_launcher_background">#FFFFFFFF</color>
          </resources>
          XML

          echo "Icon generation completed and resources placed under $RESDIR."

      - name: Setup Java 21
        if: ${{ steps.check_release.outputs.skip != 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        if: ${{ steps.check_release.outputs.skip != 'true' }}
        uses: burrunan/gradle-cache-action@v3
        with:
          build-root-directory: morphe-google-photos

      - name: Overlay Custom Patches from GPhotos-Mod into morphe-google-photos
        if: ${{ steps.check_release.outputs.skip != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "custom-patches" ]; then
            echo "Copying custom-patches into morphe-google-photos..."
            cp -r custom-patches/* morphe-google-photos/
          fi

      - name: Build Morphe Patches from morphe-google-photos
        if: ${{ steps.check_release.outputs.skip != 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd morphe-google-photos
          chmod +x gradlew
          ./gradlew :extensions:shared:syncExtension :patches:buildAndroid generatePatchesList -Pgpr.user=${{ github.actor }} -Pgpr.key=${{ secrets.GITHUB_TOKEN }}

      - name: Locate Patch Bundle
        if: ${{ steps.check_release.outputs.skip != 'true' }}
        id: locate_patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH_FILE=$(find morphe-google-photos/patches/build/libs \( -name "patches-*.mpp" -o -name "patches-*.jar" \) | grep -v "\-sources" | grep -v "\-javadoc" | sort -V | tail -n 1)
          if [ -z "$PATCH_FILE" ]; then
            echo "Error: Patch file not found!"
            exit 1
          fi
          echo "PATCH_PATH=$PATCH_FILE" >> "$GITHUB_ENV"
          echo "Found patch file: $PATCH_FILE"

      - name: Setup Morphe CLI
        if: ${{ steps.check_release.outputs.skip != 'true' }}
        shell: bash
        env:
          MORPHE_CLI_SHA256: ${{ secrets.MORPHE_CLI_SHA256 }}
        run: |
          set -euo pipefail
          MORPHE_TAG="v1.16.0"
          API_URL="https://api.github.com/repos/MorpheApp/morphe-desktop/releases/tags/${MORPHE_TAG}"
          CLI_URL=$(python - <<'PY'
          import json, urllib.request
          url = "https://api.github.com/repos/MorpheApp/morphe-desktop/releases/tags/v1.16.0"
          req = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "User-Agent": "GPhotos-Mod-CI",
          })
          with urllib.request.urlopen(req, timeout=30) as resp:
              data = json.load(resp)
          for asset in data.get("assets", []):
              name = asset.get("name", "")
              if name.endswith("all.jar"):
                  print(asset["browser_download_url"])
                  break
          else:
              raise SystemExit("Could not locate Morphe CLI asset")
          PY
          )
          if [ -z "$CLI_URL" ]; then
            echo "Could not resolve Morphe CLI download URL."
            exit 1
          fi
          curl -fsSL --proto '=https' "$CLI_URL" -o morphe-cli.jar
          if [ -n "${MORPHE_CLI_SHA256:-}" ]; then
            ACTUAL_SHA=$(sha256sum morphe-cli.jar | awk '{print $1}')
            if [ "$ACTUAL_SHA" != "$MORPHE_CLI_SHA256" ]; then
              echo "::error::Morphe CLI checksum mismatch."
              exit 1
            fi
          fi

      - name: Download Google Photos APK
        if: ${{ steps.check_release.outputs.skip != 'true' }}
        id: download_apk
        shell: bash
        env:
          DIRECT_URL: ${{ inputs.direct_apk_url }}
        run: |
          set -euo pipefail
          if [ -n "${DIRECT_URL:-}" ]; then
            case "$DIRECT_URL" in
              https://*.apkmirror.com/*|https://apkmirror.com/*)
                ;;
              *)
                echo "::error::Only APKMirror HTTPS URLs are allowed for manual input."
                exit 1
                ;;
            esac
            python .github/scripts/download_apk.py --direct-url "$DIRECT_URL" --output google-photos-base.apk
          else
            python .github/scripts/download_apk.py --retries 3 --output google-photos-base.apk
          fi

          python3 - <<'PY'
          import zipfile
          p = 'google-photos-base.apk'
          with zipfile.ZipFile(p) as zf:
              names = zf.namelist()
              if not names or not any(name.endswith('AndroidManifest.xml') for name in names):
                  raise SystemExit('Downloaded file does not look like a valid APK archive.')
          print('APK structure validation passed.')
          PY

      - name: Extract Actual APK Version
        if: ${{ steps.check_release.outputs.skip != 'true' }}
        id: get_apk_ver
        shell: bash
        run: |
          set -euo pipefail
          AAPT_PATH=$(find "$ANDROID_HOME/build-tools" -name "aapt" | sort -V | tail -n 1)
          if [ -z "$AAPT_PATH" ]; then
            echo "::error::aapt not found in $ANDROID_HOME/build-tools"
            exit 1
          fi
          APK_VER=$($AAPT_PATH dump badging google-photos-base.apk | grep -oP "versionName='\K[^']+")
          echo "Actual APK version extracted: $APK_VER"
          echo "apk_version=$APK_VER" >> "$GITHUB_OUTPUT"

      - name: Patch Google Photos APKs (Mod & Original)
        if: ${{ steps.check_release.outputs.skip != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "🧩 [1/2] Building Mod Package (com.sridhar.gphotosmod)..."
          java -jar morphe-cli.jar patch \
            -f \
            -p "${{ env.PATCH_PATH }}" \
            -d "Custom Morphe branding" \
            -e "Flag manager & Toolkit" \
            -O components="both" \
            --unsigned \
            -o patched-mod-unsigned.apk \
            google-photos-base.apk

          echo "🧩 [2/2] Building Original Package (com.sridhar.gphotosmod.original)..."
          java -jar morphe-cli.jar patch \
            -f \
            -p "${{ env.PATCH_PATH }}" \
            -e "Official package name" \
            -d "Custom Morphe branding" \
            -e "Flag manager & Toolkit" \
            -O components="both" \
            --unsigned \
            -o patched-original-unsigned.apk \
            google-photos-base.apk

      - name: Prepare release filenames
        if: ${{ steps.check_release.outputs.skip != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          APK_VER="${{ steps.get_apk_ver.outputs.apk_version }}"
          APK_VER=$(printf '%s' "$APK_VER" | sed -E 's/[^0-9.]//g; s/\.+$//')
          if [ -z "$APK_VER" ]; then
            APK_VER="build-${{ github.run_number }}"
          fi
          OUT_MOD="GPhotos-Mod-v${APK_VER}-mod.apk"
          OUT_ORIGINAL="GPhotos-Mod-v${APK_VER}-original.apk"
          echo "RELEASE_APK_MOD=${OUT_MOD}" >> "$GITHUB_ENV"
          echo "RELEASE_APK_ORIGINAL=${OUT_ORIGINAL}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${APK_VER}" >> "$GITHUB_ENV"
          echo "Prepared release filenames: $OUT_MOD , $OUT_ORIGINAL"

      - name: Sign Patched APKs (safe decode + verify keystore)
        if: ${{ steps.check_release.outputs.skip != 'true' }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          set -euo pipefail

          APK_VER="${{ steps.get_apk_ver.outputs.apk_version }}"
          APK_VER=$(printf '%s' "$APK_VER" | sed -E 's/[^0-9.]//g; s/\.+$//')
          if [ -z "$APK_VER" ]; then
            APK_VER="build-${{ github.run_number }}"
          fi
          OUT_MOD="GPhotos-Mod-v${APK_VER}-mod.apk"
          OUT_ORIGINAL="GPhotos-Mod-v${APK_VER}-original.apk"
          KS_ALIAS="${KEYSTORE_ALIAS:-gphotosmod}"
          KS_PASS="${KEYSTORE_PASS:-android}"
          KEY_PASS_VALUE="${KEY_PASS:-android}"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Decoding provided KEYSTORE_BASE64 into release.keystore..."
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore || {
              echo "ERROR: base64 decode failed. The KEYSTORE_BASE64 secret may be corrupted or not valid base64."
              exit 2
            }

            if ! keytool -list -keystore release.keystore -storepass "$KS_PASS" -storetype PKCS12 >/dev/null 2>&1; then
              echo "ERROR: keytool failed to read the decoded keystore (PKCS12)."
              exit 3
            fi
          else
            echo "No KEYSTORE_BASE64 provided — generating a new temporary keystore for this run."
            keytool -genkeypair \
              -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=GPhotos-Mod, OU=CI, O=GPhotos-Mod, L=Internet, S=Internet, C=US" \
              -keystore release.keystore \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS_VALUE" \
              -storetype PKCS12
          fi

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -n 1)

          for FLAVOR in mod original; do
            echo "Processing ${FLAVOR} package..."

            IN_UNSIGNED="patched-${FLAVOR}-unsigned.apk"
            if [ ! -f "$IN_UNSIGNED" ]; then
              echo "Error: input APK not found: $IN_UNSIGNED"
              exit 1
            fi

            python3 .github/scripts/repack_apk.py --input "$IN_UNSIGNED" --output "patched-${FLAVOR}-fixed.apk"

            "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "patched-${FLAVOR}-fixed.apk" "patched-${FLAVOR}-aligned.apk"

            TARGET_OUT=$([ "$FLAVOR" = "mod" ] && echo "$OUT_MOD" || echo "$OUT_ORIGINAL")
            echo "Signing -> $TARGET_OUT"
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks release.keystore \
              --ks-pass pass:"$KS_PASS" \
              --key-pass pass:"$KEY_PASS_VALUE" \
              --ks-key-alias "$KS_ALIAS" \
              --out "${TARGET_OUT}" \
              "patched-${FLAVOR}-aligned.apk"

            echo "Verifying signature for ${TARGET_OUT}..."
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose "${TARGET_OUT}"

            rm -f "patched-${FLAVOR}-fixed.apk" "patched-${FLAVOR}-aligned.apk"
          done

          rm -f release.keystore || true

      - name: Upload Mod APK Artifact
        if: ${{ steps.check_release.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_APK_MOD }}
          path: ${{ env.RELEASE_APK_MOD }}

      - name: Upload Original APK Artifact
        if: ${{ steps.check_release.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_APK_ORIGINAL }}
          path: ${{ env.RELEASE_APK_ORIGINAL }}

      - name: Publish or Update Patched APK Release
        if: ${{ steps.check_release.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ env.RELEASE_VERSION }}"
          TITLE="GPhotos-Mod v${{ env.RELEASE_VERSION }}"
          APK_MOD="${{ env.RELEASE_APK_MOD }}"
          APK_ORIGINAL="${{ env.RELEASE_APK_ORIGINAL }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Overwriting APK assets..."
            gh release upload "$TAG" "$APK_MOD" "$APK_ORIGINAL" --clobber
            gh release edit "$TAG" --title "$TITLE" --latest
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$APK_MOD" "$APK_ORIGINAL" --title "$TITLE" --latest
          fi
