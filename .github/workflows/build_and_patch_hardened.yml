# Hardened CI: Generate icons, verify morphe CLI, patch, sign with keystore from secrets, upload artifacts, gated publish.
name: Hardened Build, Patch & Release (secure)

# least privilege by default
permissions:
  contents: read
  packages: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      direct_apk_url:
        description: 'Direct APK Download URL (Optional fallback)'
        required: false
        type: string
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'  # optional daily run; adjust or remove as desired

env:
  MORPHE_DIR: morphe-google-photos
  APP_RES: morphe-google-photos/app/src/main/res
  ICON_SRC: .github/icons/icon.png
  # Default pinned Morphe CLI (change URL if you want another pinned release)
  MORPHE_CLI_URL: https://github.com/MorpheApp/morphe-desktop/releases/download/v1.18.1/morphe-desktop-1.18.1-all.jar

jobs:
  build:
    name: Build, Patch & Sign (secure)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository (no credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout Morphe repo (no credentials)
        uses: actions/checkout@v4
        with:
          repository: 'Akash-Sriram/morphe-google-photos'
          path: ${{ env.MORPHE_DIR }}
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned Python deps
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4==4.12.2 curl_cffi==0.10.0

      - name: Ensure required secrets present
        run: |
          missing=""
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then missing="$missing KEYSTORE_BASE64"; fi
          if [ -z "${{ secrets.MORPHE_CLI_SHA256 }}" ]; then missing="$missing MORPHE_CLI_SHA256"; fi
          if [ -n "$missing" ]; then
            echo "Missing required secrets:$missing"
            echo "Please add them in Settings → Secrets and Variables → Actions and re-run."
            exit 1
          fi

      - name: Generate launcher icons from provided icon (if present)
        run: |
          set -euo pipefail
          if [ -f "${{ env.ICON_SRC }}" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
            mkdir -p "${{ env.APP_RES }}/mipmap-mdpi" "${{ env.APP_RES }}/mipmap-hdpi" "${{ env.APP_RES }}/mipmap-xhdpi" "${{ env.APP_RES }}/mipmap-xxhdpi" "${{ env.APP_RES }}/mipmap-xxxhdpi" "${{ env.APP_RES }}/mipmap-anydpi-v26" "${{ env.APP_RES }}/values"
            convert "${{ env.ICON_SRC }}" -background none -gravity center -resize 48x48^ -extent 48x48 "${{ env.APP_RES }}/mipmap-mdpi/ic_launcher.png"
            convert "${{ env.ICON_SRC }}" -background none -gravity center -resize 72x72^ -extent 72x72 "${{ env.APP_RES }}/mipmap-hdpi/ic_launcher.png"
            convert "${{ env.ICON_SRC }}" -background none -gravity center -resize 96x96^ -extent 96x96 "${{ env.APP_RES }}/mipmap-xhdpi/ic_launcher.png"
            convert "${{ env.ICON_SRC }}" -background none -gravity center -resize 144x144^ -extent 144x144 "${{ env.APP_RES }}/mipmap-xxhdpi/ic_launcher.png"
            convert "${{ env.ICON_SRC }}" -background none -gravity center -resize 192x192^ -extent 192x192 "${{ env.APP_RES }}/mipmap-xxxhdpi/ic_launcher.png"
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp "${{ env.APP_RES }}/$d/ic_launcher.png" "${{ env.APP_RES }}/$d/ic_launcher_round.png"
            done
            convert "${{ env.ICON_SRC }}" -background none -gravity center -resize 432x432^ -extent 432x432 "${{ env.APP_RES }}/mipmap-anydpi-v26/ic_launcher_foreground.png"
            cat > "${{ env.APP_RES }}/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
            <?xml version="1.0" encoding="utf-8"?>
            <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
            </adaptive-icon>
            XML
                        cat > "${{ env.APP_RES }}/values/colors.xml" <<'XML'
            <?xml version="1.0" encoding="utf-8"?>
            <resources>
              <color name="ic_launcher_background">#FFFFFFFF</color>
            </resources>
            XML
          else
            echo "Icon source not found at $ICON_SRC — continuing without icon generation."
          fi

      - name: Download pinned Morphe CLI and verify checksum
        run: |
          set -euo pipefail
          URL="${{ secrets.MORPHE_CLI_URL || env.MORPHE_CLI_URL }}"
          EXPECTED="${{ secrets.MORPHE_CLI_SHA256 }}"
          echo "Downloading Morphe CLI from pinned URL"
          curl -fsSL "$URL" -o morphe-cli.jar
          echo "${EXPECTED}  morphe-cli.jar" > morphe-cli.sha256
          sha256sum -c morphe-cli.sha256

      - name: Download Google Photos APK
        run: |
          set -euo pipefail
          DIRECT="${{ github.event.inputs.direct_apk_url || '' }}"
          if [ -n "$DIRECT" ]; then
            python .github/scripts/download_apk.py --direct-url "$DIRECT" --output google-photos-base.apk
          else
            python .github/scripts/download_apk.py --retries 3 --output google-photos-base.apk
          fi

      - name: Build Morphe patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "${{ env.MORPHE_DIR }}"
          chmod +x gradlew
          ./gradlew :extensions:shared:syncExtension :patches:buildAndroid generatePatchesList -Pgpr.user=${{ github.actor }} -Pgpr.key=${{ secrets.GITHUB_TOKEN }}

      - name: Locate patch bundle
        id: locate_patch
        run: |
          PATCH_FILE=$(find "${{ env.MORPHE_DIR }}/patches/build/libs" \( -name "patches-*.mpp" -o -name "patches-*.jar" \) | grep -v "\-sources" | grep -v "\-javadoc" | sort -V | tail -n 1 || true)
          if [ -z "$PATCH_FILE" ]; then
            echo "Patch bundle not found"
            exit 1
          fi
          echo "PATCH_PATH=$PATCH_FILE" >> $GITHUB_ENV

      - name: Patch Google Photos APKs (unsigned)
        run: |
          set -euo pipefail
          java -jar morphe-cli.jar patch -f -p "${{ env.PATCH_PATH }}" -d "Custom Morphe branding" -e "Flag manager & Toolkit" -O components="both" --unsigned -o patched-mod-unsigned.apk google-photos-base.apk
          java -jar morphe-cli.jar patch -f -p "${{ env.PATCH_PATH }}" -e "Official package name" -d "Custom Morphe branding" -e "Flag manager & Toolkit" -O components="both" --unsigned -o patched-original-unsigned.apk google-photos-base.apk

      - name: Prepare release filenames
        id: prepare_names
        run: |
          set -euo pipefail
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/aapt 2>/dev/null | tail -n1 || true)
          if [ -n "$AAPT" ]; then
            APK_VER=$($AAPT dump badging google-photos-base.apk 2>/dev/null | grep -oP "versionName='\K[^']+" || echo "")
          else
            APK_VER=""
          fi
          APK_VER=$(echo "$APK_VER" | sed -e 's/[^0-9.]//g' -e 's/\.*$//')
          if [ -z "$APK_VER" ]; then APK_VER="build-${{ github.run_number }}"; fi
          OUT_MOD="GPhotos-Mod-v${APK_VER}-mod.apk"
          OUT_ORIG="GPhotos-Mod-v${APK_VER}-original.apk"
          echo "RELEASE_APK_MOD=$OUT_MOD" >> $GITHUB_ENV
          echo "RELEASE_APK_ORIGINAL=$OUT_ORIG" >> $GITHUB_ENV
          echo "RELEASE_VERSION=$APK_VER" >> $GITHUB_ENV

      - name: Decode keystore safely and verify (no printing)
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          KS_PASS="${{ secrets.KEYSTORE_PASS || 'android' }}"
          if ! keytool -list -keystore release.keystore -storepass "$KS_PASS" >/dev/null 2>&1; then
            echo "ERROR: keystore verification failed (invalid base64, password, or unsupported keystore format)."
            exit 1
          fi

      - name: Sign & zipalign patched APKs
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          if [ -z "$BUILD_TOOLS_DIR" ]; then echo "Android build tools not found in ANDROID_HOME"; exit 1; fi
          KS_PASS="${{ secrets.KEYSTORE_PASS || 'android' }}"
          KEY_PASS="${{ secrets.KEY_PASS || 'android' }}"
          KS_ALIAS="${{ secrets.KEYSTORE_ALIAS || 'gphotosmod' }}"
          OUT_MOD="${{ env.RELEASE_APK_MOD }}"
          OUT_ORIG="${{ env.RELEASE_APK_ORIGINAL }}"

          for FL in mod original; do
            IN="patched-${FL}-unsigned.apk"
            FIXED="patched-${FL}-fixed.apk"
            ALIGNED="patched-${FL}-aligned.apk"
            if [ ! -f "$IN" ]; then echo "Missing $IN"; exit 1; fi
            python3 .github/scripts/repack_apk.py --input "$IN" --output "$FIXED"
            "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$FIXED" "$ALIGNED"
            TARGET=$([ "$FL" = "mod" ] && echo "$OUT_MOD" || echo "$OUT_ORIG")
            "$BUILD_TOOLS_DIR/apksigner" sign --ks release.keystore --ks-pass pass:$KS_PASS --key-pass pass:$KEY_PASS --ks-key-alias $KS_ALIAS --out "$TARGET" "$ALIGNED"
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$TARGET"
            rm -f "$FIXED" "$ALIGNED"
          done

      - name: Upload signed APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: patched-apks
          path: |
            ${{ env.RELEASE_APK_MOD }}
            ${{ env.RELEASE_APK_ORIGINAL }}

  publish:
    name: Publish Release (requires approval)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: production
    if: needs.build.result == 'success' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout (no credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download signed artifacts
        uses: actions/download-artifact@v4
        with:
          name: patched-apks
          path: ./release-artifacts

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ env.RELEASE_VERSION }}"
          if [ -z "$TAG" ]; then TAG="v${{ github.run_number }}"; fi
          MOD=$(ls ./release-artifacts | grep -i 'mod\.apk' | head -n1)
          ORIG=$(ls ./release-artifacts | grep -i 'original\.apk' | head -n1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "./release-artifacts/$MOD" "./release-artifacts/$ORIG" --clobber
            gh release edit "$TAG" --title "GPhotos-Mod $TAG" --latest
          else
            gh release create "$TAG" "./release-artifacts/$MOD" "./release-artifacts/$ORIG" --title "GPhotos-Mod $TAG" --latest
          fi
