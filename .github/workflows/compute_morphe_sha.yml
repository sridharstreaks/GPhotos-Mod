name: Compute Morphe CLI SHA-256

on:
  workflow_dispatch:
    inputs:
      morphe_url:
        description: 'Optional: direct URL to the morphe-desktop .jar; if empty uses the default pinned URL.'
        required: false
        type: string

env:
  # default pinned release (one-time helper); change if you want another default
  DEFAULT_MORPHE_CLI_URL: https://github.com/MorpheApp/morphe-desktop/releases/download/v1.18.1/morphe-desktop-1.18.1-all.jar

jobs:
  compute-sha:
    runs-on: ubuntu-latest
    steps:
      - name: Download morphe CLI jar
        run: |
          set -euo pipefail
          URL="${{ github.event.inputs.morphe_url || env.DEFAULT_MORPHE_CLI_URL }}"
          echo "Downloading: $URL"
          curl -fsSL "$URL" -o morphe-cli.jar
          FILESIZE=$(stat -c%s morphe-cli.jar || stat -f%z morphe-cli.jar)
          echo "Downloaded morphe-cli.jar (${FILESIZE} bytes)"
          echo -n "SHA256: "
          sha256sum morphe-cli.jar | awk '{print $1}'
